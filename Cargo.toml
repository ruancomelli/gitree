[package]
name = "gitree"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Native git worktree workflow tool"
license = "MIT"
repository = "https://github.com/nicholasgasior/gitree"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gitree"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
pathdiff = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
